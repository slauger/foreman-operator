apiVersion: platform.theforeman.org/v1alpha1
kind: Frontend
metadata:
  name: production
spec:
  foremanRef: production
  replicas: 2
  tls:
    server:
      issuerRef:
        name: letsencrypt-dns01
        kind: ClusterIssuer
    clientCA:
      issuerRef:
        name: foreman-internal-ca
  exposure:
    type: Auto
