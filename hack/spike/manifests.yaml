# Hand-written manifests for the first Foreman spike. Replaced by the operator later.
# Pods run under an arbitrary UID to exercise the OpenShift behavior on plain Kubernetes.
apiVersion: v1
kind: List
items:
  - apiVersion: cert-manager.io/v1
    kind: Issuer
    metadata:
      name: selfsigned
    spec:
      selfSigned: {}
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: foreman-internal-ca
    spec:
      isCA: true
      commonName: foreman-internal-ca
      secretName: foreman-internal-ca
      duration: 175200h
      privateKey:
        algorithm: RSA
        size: 4096
        rotationPolicy: Never
      issuerRef:
        name: selfsigned
  - apiVersion: cert-manager.io/v1
    kind: Issuer
    metadata:
      name: foreman-internal-ca
    spec:
      ca:
        secretName: foreman-internal-ca
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: frontend-server
    spec:
      secretName: frontend-server
      dnsNames:
        - foreman.spike.example.test
      usages:
        - server auth
      issuerRef:
        name: foreman-internal-ca
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: spike-client
    spec:
      secretName: spike-client
      commonName: spike-client.example.test
      usages:
        - client auth
      issuerRef:
        name: foreman-internal-ca
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: foreman-settings
    data:
      settings.yaml: |
        ---
        :domain: spike.example.test
        :fqdn: foreman.spike.example.test
        :foreman_url: https://foreman.spike.example.test
        :hosts:
          - foreman.spike.example.test
        :trusted_proxies:
          - 127.0.0.0/8
          - 10.42.0.0/16
        :require_ssl: true
        :rails_cache_store:
          :type: redis
          :urls:
            - redis://valkey:6379/4
          :options:
            :compress: true
            :namespace: foreman
        :ssl_client_dn_env: HTTP_SSL_CLIENT_S_DN
        :ssl_client_verify_env: HTTP_SSL_CLIENT_VERIFY
        :ssl_client_cert_env: HTTP_SSL_CLIENT_CERT
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: frontend-config
    data:
      site.conf: |
        ServerName foreman.spike.example.test
        Listen 8443 https
        SSLSessionCache shmcb:/tmp/ssl_scache(512000)

        <VirtualHost *:8443>
          ServerName foreman.spike.example.test
          SSLEngine on
          SSLCertificateFile /etc/frontend/server/tls.crt
          SSLCertificateKeyFile /etc/frontend/server/tls.key
          SSLCertificateChainFile /etc/frontend/server/ca.crt
          SSLCACertificateFile /etc/frontend/server/ca.crt
          SSLVerifyClient optional
          SSLVerifyDepth 3
          SSLOptions +StdEnvVars +ExportCertData

          RequestHeader unset REMOTE-USER
          RequestHeader set X-Forwarded-Proto "https"
          RequestHeader set SSL-CLIENT-S-DN "%{SSL_CLIENT_S_DN}s"
          RequestHeader set SSL-CLIENT-CERT "%{SSL_CLIENT_CERT}s"
          RequestHeader set SSL-CLIENT-VERIFY "%{SSL_CLIENT_VERIFY}s"

          ProxyPreserveHost On
          ProxyRequests Off
          ProxyPass / http://foreman-web:3000/ retry=0 timeout=900 upgrade=websocket
          ProxyPassReverse / http://foreman-web:3000/
        </VirtualHost>

        <VirtualHost *:8080>
          ServerName foreman.spike.example.test
          RequestHeader unset REMOTE-USER
          RequestHeader set X-Forwarded-Proto "http"
          RequestHeader set SSL-CLIENT-S-DN ""
          RequestHeader set SSL-CLIENT-CERT ""
          RequestHeader set SSL-CLIENT-VERIFY ""
          ProxyPreserveHost On
          ProxyPass / http://foreman-web:3000/ retry=0 timeout=900
          ProxyPassReverse / http://foreman-web:3000/
        </VirtualHost>
  - apiVersion: v1
    kind: Service
    metadata:
      name: valkey
    spec:
      selector:
        app: valkey
      ports:
        - port: 6379
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: valkey
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: valkey
      template:
        metadata:
          labels:
            app: valkey
        spec:
          securityContext: &podSecurity
            runAsNonRoot: true
            runAsUser: 1000700000
            runAsGroup: 0
            fsGroup: 1000700000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: valkey
              image: quay.io/sclorg/valkey-8-c10s:latest
              ports:
                - containerPort: 6379
              securityContext: &containerSecurity
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: data
                  mountPath: /var/lib/valkey/data
          volumes:
            - name: data
              emptyDir: {}
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: foreman-migrate
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext: *podSecurity
          containers:
            - name: migrate
              image: ghcr.io/slauger/foreman-operator-foreman:spike
              imagePullPolicy: Always
              command: ["/bin/bash", "-c", "bin/rails db:migrate && bin/rails db:seed"]
              env: &foremanEnv
                - name: DB_URI
                  valueFrom:
                    secretKeyRef:
                      name: foreman-db-app
                      key: uri
                - name: DATABASE_URL
                  value: "$(DB_URI)?pool=9&sslmode=require"
                - name: ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: foreman-secrets
                      key: encryption-key
                - name: SECRET_KEY_BASE
                  valueFrom:
                    secretKeyRef:
                      name: foreman-secrets
                      key: secret-key-base
                - name: DYNFLOW_REDIS_URL
                  value: redis://valkey:6379/6
                - name: REDIS_PROVIDER
                  value: DYNFLOW_REDIS_URL
                - name: SEED_ADMIN_USER
                  value: admin
                - name: SEED_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: foreman-secrets
                      key: admin-password
                - name: FOREMAN_PUMA_WORKERS
                  value: "1"
                - name: FOREMAN_PUMA_THREADS_MIN
                  value: "5"
                - name: FOREMAN_PUMA_THREADS_MAX
                  value: "5"
              securityContext: *containerSecurity
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              volumeMounts: &foremanMounts
                - name: settings
                  mountPath: /etc/foreman/settings.yaml
                  subPath: settings.yaml
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: rails-tmp
                  mountPath: /usr/share/foreman/tmp
          volumes: &foremanVolumes
            - name: settings
              configMap:
                name: foreman-settings
            - name: tmp
              emptyDir: {}
            - name: rails-tmp
              emptyDir: {}
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: dynflow-orchestrator
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: dynflow-orchestrator
      template:
        metadata:
          labels:
            app: dynflow-orchestrator
        spec:
          securityContext: *podSecurity
          containers:
            - name: sidekiq
              image: ghcr.io/slauger/foreman-operator-foreman:spike
              imagePullPolicy: Always
              command: ["sidekiq", "-e", "production", "-r", "./extras/dynflow-sidekiq.rb", "-C", "/etc/foreman/dynflow/orchestrator.yml"]
              env: *foremanEnv
              securityContext: *containerSecurity
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 1Gi
              volumeMounts: *foremanMounts
          volumes: *foremanVolumes
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: dynflow-worker
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: dynflow-worker
      template:
        metadata:
          labels:
            app: dynflow-worker
        spec:
          securityContext: *podSecurity
          containers:
            - name: sidekiq
              image: ghcr.io/slauger/foreman-operator-foreman:spike
              imagePullPolicy: Always
              command: ["sidekiq", "-e", "production", "-r", "./extras/dynflow-sidekiq.rb", "-C", "/etc/foreman/dynflow/worker.yml"]
              env: *foremanEnv
              securityContext: *containerSecurity
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 1Gi
              volumeMounts: *foremanMounts
          volumes: *foremanVolumes
  - apiVersion: v1
    kind: Service
    metadata:
      name: foreman-web
    spec:
      selector:
        app: foreman-web
      ports:
        - port: 3000
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: foreman-web
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: foreman-web
      template:
        metadata:
          labels:
            app: foreman-web
        spec:
          securityContext: *podSecurity
          containers:
            - name: foreman
              image: ghcr.io/slauger/foreman-operator-foreman:spike
              imagePullPolicy: Always
              ports:
                - containerPort: 3000
              env: *foremanEnv
              securityContext: *containerSecurity
              startupProbe: &probe
                httpGet:
                  path: /api/v2/ping
                  port: 3000
                  httpHeaders:
                    - name: Host
                      value: foreman.spike.example.test
                    - name: X-Forwarded-Proto
                      value: https
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 60
              readinessProbe: *probe
              resources:
                requests:
                  cpu: 200m
                  memory: 1Gi
                limits:
                  memory: 3Gi
              volumeMounts: *foremanMounts
          volumes: *foremanVolumes
  - apiVersion: v1
    kind: Service
    metadata:
      name: frontend
    spec:
      selector:
        app: frontend
      ports:
        - name: https
          port: 8443
        - name: http
          port: 8080
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: frontend
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: frontend
      template:
        metadata:
          labels:
            app: frontend
        spec:
          securityContext: *podSecurity
          containers:
            - name: httpd
              image: ghcr.io/slauger/foreman-operator-frontend:spike
              imagePullPolicy: Always
              ports:
                - containerPort: 8443
                - containerPort: 8080
              securityContext: *containerSecurity
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: config
                  mountPath: /etc/httpd/conf.d
                  readOnly: true
                - name: server-cert
                  mountPath: /etc/frontend/server
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: run
                  mountPath: /run/httpd
          volumes:
            - name: config
              configMap:
                name: frontend-config
            - name: server-cert
              secret:
                secretName: frontend-server
            - name: tmp
              emptyDir: {}
            - name: run
              emptyDir: {}
