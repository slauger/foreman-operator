                    type: string
                  tag:
                    description: Tag is the image tag.
                    type: string
                type: object
              plugins:
                description: Plugins lists the Foreman plugins to enable. Each plugin
                  must be present in the image.
                items:
                  type: string
                type: array
              tls:
                description: TLS selects the source of the internal certificates.
                properties:
                  issuerRef:
                    description: IssuerRef requests certificates from a cert-manager
