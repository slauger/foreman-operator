---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: frontends.platform.theforeman.org
spec:
  group: platform.theforeman.org
  names:
    kind: Frontend
    listKind: FrontendList
    plural: frontends
    singular: frontend
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.foremanRef
      name: Foreman
      type: string
    - jsonPath: .spec.exposure.type
      name: Exposure
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Frontend is the Schema for the frontends API.
          It terminates mutual TLS in the cluster and exposes Foreman to clients.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FrontendSpec defines the desired state of Frontend.
            properties:
              exposure:
                description: Exposure configures how clients reach this Frontend.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Annotations are added to the created Service or Route.
                    type: object
                  gatewayRef:
                    description: GatewayRef selects the Gateway and listeners for
                      type TLSRoute.
                    properties:
                      httpSectionName:
                        description: HTTPSectionName is the listener for the HTTPRoute
                          used by installers.
                        type: string
                      name:
                        description: Name of the Gateway.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace of the Gateway. Defaults to the namespace
                          of the Frontend.
                        type: string
                      tlsSectionName:
                        description: TLSSectionName is the listener with TLS passthrough
                          for the TLSRoute.
                        type: string
                    required:
                    - name
                    type: object
                  type:
                    default: Auto
                    description: Type selects the exposure mechanism.
                    enum:
                    - Auto
                    - LoadBalancer
                    - Route
                    - TLSRoute
                    - ClusterIP
                    type: string
                type: object
                x-kubernetes-validations:
                - message: gatewayRef is required when type is TLSRoute
                  rule: self.type != 'TLSRoute' || has(self.gatewayRef)
              foremanRef:
                description: ForemanRef names the Foreman served by this Frontend.
                minLength: 1
                type: string
              image:
                description: Image selects the frontend container image.
                properties:
                  digest:
                    description: Digest pins the image and takes precedence over Tag.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  pullPolicy:
                    default: IfNotPresent
                    description: PullPolicy is the image pull policy.
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    type: string
                  repository:
                    description: Repository is the image repository. The operator
                      picks a default if empty.
                    type: string
                  tag:
                    description: Tag is the image tag.
                    type: string
                type: object
              replicas:
                default: 2
                description: Replicas is the number of frontend pods.
                format: int32
                minimum: 0
                type: integer
              tls:
                description: TLS selects the server certificate and the client CA.
                properties:
                  clientCA:
                    description: ClientCA selects the CA that verifies client certificates.
                    properties:
                      issuerRef:
                        description: IssuerRef requests certificates from a cert-manager
                          issuer.
                        properties:
                          kind:
                            default: Issuer
                            description: Kind of the issuer.
                            enum:
                            - Issuer
                            - ClusterIssuer
                            type: string
                          name:
                            description: Name of the issuer.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      secretName:
                        description: SecretName references an existing Secret with
                          tls.crt, tls.key, and ca.crt.
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of issuerRef or secretName must be set
                      rule: has(self.issuerRef) != has(self.secretName)
                  server:
                    description: Server selects the certificate presented to clients.
                    properties:
                      issuerRef:
                        description: IssuerRef requests certificates from a cert-manager
                          issuer.
                        properties:
                          kind:
                            default: Issuer
                            description: Kind of the issuer.
                            enum:
                            - Issuer
                            - ClusterIssuer
                            type: string
                          name:
                            description: Name of the issuer.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      secretName:
                        description: SecretName references an existing Secret with
                          tls.crt, tls.key, and ca.crt.
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of issuerRef or secretName must be set
                      rule: has(self.issuerRef) != has(self.secretName)
                required:
                - clientCA
                - server
                type: object
            required:
            - foremanRef
            - tls
            type: object
          status:
            description: FrontendStatus defines the observed state of Frontend.
            properties:
              conditions:
                description: Conditions represent the latest observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation last processed by
                  the controller.
                format: int64
                type: integer
              phase:
                description: Phase is the current lifecycle phase.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
